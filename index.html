<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>btap về nhà js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h2>Quản lý công việc</h2>
        
        <!-- Giao diện nhập công việc -->
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Nhập tên công việc...">
            <button id="add-btn">Thêm</button>
        </div>

        <!-- Danh sách công việc -->
        <ul id="todo-list">
            <!-- Các công việc sẽ được thêm vào đây bằng JavaScript -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
